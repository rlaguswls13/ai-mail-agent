<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계정 설정 - ai-mail-agent</title>
  <style>
    :root {
      --bg: #f5f4fb; --card: #fff; --card-2: #ece9f8; --border: #ddd9f0; --text: #201e2c;
      --muted: #6b6680; --accent: #3a5cdc; --accent-soft: #e7ebfb; --danger: #c23b3b; --ok: #1f8f6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 22px; background: var(--bg); color: var(--text);
      font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 18px; }
    .status { font-size: 0.85rem; padding: 8px 12px; border-radius: 8px; margin-bottom: 16px; }
    .status.enc { background: var(--accent-soft); color: var(--accent); }
    .status.fallback { background: #f7ecd9; color: #8a5a1a; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; margin-bottom: 16px;
    }
    .split { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .split .card { flex: 1 1 320px; margin-bottom: 0; }
    .split .card.detail { flex: 1 1 360px; background: var(--card-2); border-color: var(--border); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    tr:last-child td { border-bottom: none; }
    tr.selected td { background: var(--accent-soft); }
    .alias-cell { font-weight: 600; }
    .alias-cell .email { display: block; color: var(--muted); font-weight: 400; font-size: 0.82em; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > label { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
    input, select {
      font: inherit; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px;
      background: #fff; color: var(--text);
    }
    .btn {
      font: inherit; padding: 7px 14px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap;
    }
    .btn.secondary { background: #fff; color: var(--text); }
    .btn.danger { background: #fff; color: var(--danger); border-color: #f0d2d2; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    .msg { font-size: 0.85rem; margin-left: auto; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--ok); }
    .empty { color: var(--muted); padding: 8px 10px; }
    code { background: var(--card-2); padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }
    .mono { font-family: ui-monospace, Consolas, monospace; }
  </style>
</head>
<body>
  <h1>메일 계정</h1>
  <p class="sub">여기서 저장하면 자격증명이 <strong>암호화 볼트</strong>에 저장되고, 데이터 동기화가 즉시 새 계정으로 다시 시작됩니다.</p>

  <div id="status" class="status"></div>

  <div class="split">
    <div class="card list">
      <table>
        <thead><tr><th>별칭 / 계정</th><th>인증</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="3" class="empty">불러오는 중…</td></tr></tbody>
      </table>
    </div>

    <div class="card detail">
      <h2 style="font-size:1rem;margin:0 0 12px" id="form-title">계정 추가</h2>
      <input type="hidden" id="f-original">
      <div class="row">
        <label>메일 종류
          <select id="f-type">
            <option value="gmail">Gmail</option>
            <option value="naver">Naver</option>
            <option value="outlook">Outlook</option>
            <option value="daum">Daum</option>
          </select>
        </label>
        <label>이메일 주소
          <input type="text" id="f-user" placeholder="you@gmail.com" autocomplete="off">
        </label>
      </div>
      <div class="row">
        <label>별칭 (표시 이름)
          <input type="text" id="f-alias" placeholder="예: Gmail-업무용 (비우면 Gmail/Naver/Outlook로 표시)">
        </label>
      </div>
      <div class="row">
        <label id="f-auth-wrap">인증 방식
          <select id="f-auth">
            <option value="password">앱 비밀번호</option>
            <option value="xoauth2">OAuth (브라우저 로그인)</option>
          </select>
        </label>
        <label id="f-pass-wrap">앱 비밀번호
          <input type="password" id="f-pass" placeholder="xxxx xxxx xxxx xxxx" autocomplete="off">
        </label>
      </div>
      <div class="actions">
        <button class="btn" id="save-btn">저장</button>
        <button class="btn secondary" id="reset-btn" hidden>새 계정</button>
        <span class="msg" id="form-msg"></span>
      </div>
      <p class="sub" id="f-hint" style="margin:10px 0 0;font-size:0.8rem"></p>
    </div>
  </div>

  <script>
    const api = window.mailAgent.accounts;
    const TYPE_LABEL = { gmail: "Gmail", naver: "Naver", outlook: "Outlook", daum: "Daum" };
    const $ = (id) => document.getElementById(id);

    function setMsg(el, text, kind) {
      el.textContent = text || "";
      el.className = "msg" + (kind ? " " + kind : "");
    }

    /** 실효 인증 방식: 명시값 우선, 없으면 타입 기본(outlook=xoauth2). */
    function effectiveAuth(type, auth) {
      if (auth === "xoauth2" || auth === "password") return auth;
      return type === "outlook" ? "xoauth2" : "password";
    }

    /** 폼의 type/auth 선택에 맞춰 인증 select·비밀번호칸·안내문을 갱신한다. */
    function syncAuthUI() {
      const type = $("f-type").value;
      const authSel = $("f-auth");
      // Naver/Daum: OAuth 불가 → password 고정. Outlook: 서버가 비번 거부 → xoauth2 고정. Gmail: 선택.
      if (type === "naver" || type === "daum") { authSel.value = "password"; $("f-auth-wrap").hidden = true; }
      else if (type === "outlook") { authSel.value = "xoauth2"; $("f-auth-wrap").hidden = true; }
      else { $("f-auth-wrap").hidden = false; }

      const oauth = effectiveAuth(type, authSel.value) === "xoauth2";
      $("f-pass-wrap").hidden = oauth;
      $("f-hint").innerHTML = oauth
        ? '저장 후 트레이 <strong>"메일 로그인 (OAuth)"</strong>를 눌러 브라우저에서 로그인하세요. 비밀번호는 필요 없습니다.'
        : (type === "naver"
            ? 'Naver는 "IMAP/SMTP 사용"을 먼저 켠 뒤 발급한 <strong>앱 비밀번호</strong>를 쓰세요.'
            : (type === "daum"
                ? 'Daum은 "IMAP/POP3 사용"을 먼저 켠 뒤 발급한 <strong>앱 비밀번호</strong>를 쓰세요.'
                : '2단계 인증 후 발급한 <strong>앱 비밀번호</strong>를 쓰세요.'));
    }

    async function refreshStatus() {
      const s = await api.status();
      const el = $("status");
      if (s.encryptionAvailable) {
        el.className = "status enc";
        el.innerHTML = `자격증명은 이 PC에서만 복호화되는 암호화 볼트에 저장됩니다 · <span class="mono">${s.vaultPath}</span>`;
      } else {
        el.className = "status fallback";
        el.textContent = "이 환경에서는 볼트 암호화 키를 만들 수 없어 accounts.yaml 폴백으로 동작합니다. 편집은 여기서 되지 않습니다.";
        $("save-btn").disabled = true;
      }
    }

    async function refreshRows() {
      const rows = await api.list();
      const tbody = $("rows");
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty">등록된 계정이 없습니다. 오른쪽에서 추가하세요.</td></tr>';
        return;
      }
      tbody.innerHTML = "";
      for (const a of rows) {
        const tr = document.createElement("tr");
        if (a.user === $("f-original").value) tr.className = "selected";
        const td = (h) => { const c = document.createElement("td"); c.append(...(Array.isArray(h) ? h : [h])); return c; };

        const aliasCell = document.createElement("div");
        aliasCell.className = "alias-cell";
        aliasCell.textContent = a.alias || TYPE_LABEL[a.type] || a.type;
        const emailLine = document.createElement("span");
        emailLine.className = "email";
        emailLine.textContent = a.user;
        aliasCell.append(emailLine);
        tr.append(td(aliasCell));

        tr.append(td(effectiveAuth(a.type, a.auth) === "xoauth2" ? "OAuth" : "앱 비밀번호"));

        const editBtn = document.createElement("button");
        editBtn.className = "btn secondary"; editBtn.textContent = "수정";
        editBtn.onclick = () => fillForm(a);
        const delBtn = document.createElement("button");
        delBtn.className = "btn danger"; delBtn.textContent = "삭제";
        delBtn.style.marginLeft = "6px";
        delBtn.onclick = () => doDelete(a.user);
        const actions = td([editBtn, delBtn]);
        actions.style.textAlign = "right";
        tr.append(actions);
        tbody.append(tr);
      }
    }

    function fillForm(a) {
      $("f-original").value = a.user;
      $("f-type").value = a.type;
      $("f-auth").value = effectiveAuth(a.type, a.auth);
      $("f-user").value = a.user;
      $("f-alias").value = a.alias || "";
      $("f-pass").value = "";
      $("f-pass").placeholder = "(변경하려면 새 비밀번호 입력)";
      $("form-title").textContent = (a.alias || TYPE_LABEL[a.type] || a.type) + " 수정";
      $("save-btn").textContent = "수정 저장";
      $("reset-btn").hidden = false;
      syncAuthUI();
      setMsg($("form-msg"), "", "");
      refreshRows();
      $("f-alias").focus();
    }

    function resetForm() {
      $("f-original").value = "";
      $("f-type").value = "gmail";
      $("f-auth").value = "password";
      $("f-user").value = "";
      $("f-alias").value = "";
      $("f-pass").value = "";
      $("f-pass").placeholder = "xxxx xxxx xxxx xxxx";
      $("form-title").textContent = "계정 추가";
      $("save-btn").textContent = "저장";
      $("reset-btn").hidden = true;
      syncAuthUI();
      setMsg($("form-msg"), "", "");
      refreshRows();
    }

    async function doSave() {
      const original = $("f-original").value;
      const type = $("f-type").value;
      const auth = effectiveAuth(type, $("f-auth").value);
      const account = {
        type,
        user: $("f-user").value.trim(),
        alias: $("f-alias").value.trim(),
        password: auth === "xoauth2" ? "" : $("f-pass").value,
        // auth 필드는 Gmail 에서만 명시 저장(Naver/Daum=password, Outlook=xoauth2 는 타입 기본값).
        auth: type === "gmail" ? $("f-auth").value : "",
      };
      if (!account.user) {
        setMsg($("form-msg"), "이메일 주소를 입력하세요.", "err");
        return;
      }
      if (auth === "password" && !account.password) {
        setMsg($("form-msg"), "비밀번호를 입력하세요.", "err");
        return;
      }
      $("save-btn").disabled = true;
      setMsg($("form-msg"), "저장 중… (동기화 재시작)", "");
      try {
        const res = original
          ? await api.update(original, account)
          : await api.add(account);
        if (res && res.error) throw new Error(res.error);
        resetForm();
        await refreshRows();
        setMsg($("form-msg"), "저장됨. 파이프라인이 새 계정으로 다시 시작되었습니다.", "ok");
      } catch (err) {
        setMsg($("form-msg"), err.message || String(err), "err");
      } finally {
        $("save-btn").disabled = false;
      }
    }

    async function doDelete(user) {
      if (!confirm(user + " 계정을 삭제할까요?")) return;
      try {
        const res = await api.remove(user);
        if (res && res.error) throw new Error(res.error);
        if ($("f-original").value === user) resetForm();
        await refreshRows();
        setMsg($("form-msg"), user + " 삭제됨.", "ok");
      } catch (err) {
        setMsg($("form-msg"), err.message || String(err), "err");
      }
    }

    $("save-btn").onclick = doSave;
    $("reset-btn").onclick = resetForm;
    $("f-type").onchange = syncAuthUI;
    $("f-auth").onchange = syncAuthUI;

    syncAuthUI();
    refreshStatus();
    refreshRows();
  </script>
</body>
</html>
