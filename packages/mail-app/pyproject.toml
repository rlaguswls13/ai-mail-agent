[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mail-app"
version = "0.2.0"
description = "ai-mail-agent 앱 레이어 — app.db(SQLite) 영속 · 파이프라인 오케스트레이션 · 대시보드 리포트 · CLI"
requires-python = ">=3.11"
dependencies = []

# 형제 패키지 `mail-core` 가 필요하다(같은 저장소 packages/mail-core). 로컬 모노레포라
# PyPI 조회를 피하려고 dependencies 에 넣지 않는다 — dev-install.bat 이 순서대로 설치한다.
# mail-core 외 런타임 의존성 없음 — 표준 라이브러리만.

[project.scripts]
mail-fetch = "mail_app.fetch_mail:main"
mail-report = "mail_app.generate_html:main"

[tool.hatch.build.targets.wheel]
packages = ["mail_app"]
