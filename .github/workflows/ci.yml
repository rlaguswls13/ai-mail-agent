name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime deps
        # 파이프라인 본체(mail-core/mail-app)는 표준 라이브러리만 쓴다. admin-ui 만 flask.
        # 패키지 경로는 루트 conftest.py 가 sys.path 에 얹으므로 editable 설치가 필요 없다.
        run: python -m pip install --upgrade pip flask pytest

      - name: Run tests
        run: python -m pytest -q
